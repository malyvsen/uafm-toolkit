[project]
name = "otp"
version = "0.1.0"
description = "Print the current login code and copy it to the clipboard."
requires-python = ">=3.15"
dependencies = [
    "auth",
    "cyclopts",
    "pyperclip",
]

[project.scripts]
otp = "otp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otp"]

[tool.uv.sources]
auth = { workspace = true }

[tool.deptry.per_rule_ignores]
DEP003 = ["otp"]
