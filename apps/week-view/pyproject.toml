[project]
name = "week-view"
version = "0.1.0"
description = "Generate PNG timetables from the study plan, one week per file."
requires-python = ">=3.15"
dependencies = [
    "cyclopts",
    "pillow",
    "plan-downloader",
    "plan-parser",
    "plan-render",
    "platformdirs>=4.14.8",
]

[project.scripts]
week-view = "week_view.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/week_view"]

[tool.uv.sources]
plan-downloader = { workspace = true }
plan-parser = { workspace = true }
plan-render = { workspace = true }

[tool.deptry.per_rule_ignores]
DEP003 = ["week_view"]
