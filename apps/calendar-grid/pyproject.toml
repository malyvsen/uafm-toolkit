[project]
name = "calendar-grid"
version = "0.1.0"
description = "Render all weeks of classes as shareable PNG timetables."
requires-python = ">=3.15"
dependencies = ["cyclopts", "pillow", "plan-downloader", "plan-parser"]

[project.scripts]
calendar-grid = "calendar_grid.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calendar_grid"]

[tool.uv.sources]
plan-downloader = { workspace = true }
plan-parser = { workspace = true }

[tool.deptry.per_rule_ignores]
DEP003 = ["calendar_grid"]
