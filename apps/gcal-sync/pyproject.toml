[project]
name = "gcal-sync"
version = "0.1.0"
description = "Push the study plan to Google Calendar from your laptop."
requires-python = ">=3.15"
dependencies = [
    "auth",
    "cyclopts",
    "google-api-python-client>=2.180.0",
    "google-auth>=2.40.0",
    "google-auth-oauthlib>=1.2.2",
    "plan-downloader",
    "plan-parser",
    "platformdirs>=4.14.8",
    "python-dotenv",
    "semester",
]

[project.scripts]
gcal-sync = "gcal_sync.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gcal_sync"]

[tool.uv.sources]
auth = { workspace = true }
plan-downloader = { workspace = true }
plan-parser = { workspace = true }
semester = { workspace = true }

[tool.deptry.per_rule_ignores]
DEP003 = ["gcal_sync"]
