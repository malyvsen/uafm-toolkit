version: "3"

includes:
  python: ../../taskfiles/python.yml

tasks:
  run:
    desc: Sync the study plan to Google Calendar (args after -- are passed through)
    cmds:
      - uv run --no-sync gcal-sync {{.CLI_ARGS}}

  auth:
    desc: Authorize Google Calendar access once (opens a browser)
    cmds:
      - uv run --no-sync gcal-sync auth {{.CLI_ARGS}}

  check:
    desc: Run all checks
    deps: [python:check]
