version: "3"

includes:
  python: ../../taskfiles/python.yml

tasks:
  run:
    desc: Download a timetable PDF (args after -- are passed through)
    cmds:
      - uv run --no-sync plan-downloader {{.CLI_ARGS}}

  check:
    desc: Run all checks
    deps: [python:check]

  browsers:
    desc: Install the Firefox build Playwright drives
    cmds:
      - uv run --no-sync playwright install firefox

  record:
    desc: Open Firefox with the action recorder (pass start URL after --)
    cmds:
      - uv run --no-sync playwright codegen --browser firefox --target python {{.CLI_ARGS}}
