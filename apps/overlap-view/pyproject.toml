[project]
name = "overlap-view"
version = "0.1.0"
description = "Generate a typical-week PNG from the study plan, overlapping all weeks."
requires-python = ">=3.15"
dependencies = [
    "cyclopts",
    "pillow",
    "plan-downloader",
    "plan-parser",
    "plan-render",
    "platformdirs>=4.14.8",
]

[project.scripts]
overlap-view = "overlap_view.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overlap_view"]

[tool.uv.sources]
plan-downloader = { workspace = true }
plan-parser = { workspace = true }
plan-render = { workspace = true }

[tool.deptry.per_rule_ignores]
DEP003 = ["overlap_view"]
