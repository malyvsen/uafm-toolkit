[project]
name = "semester"
version = "0.1.0"
description = "UAFM teaching periods and semester identity."
requires-python = ">=3.15"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semester"]

[tool.deptry.per_rule_ignores]
DEP003 = ["semester"]
