[project]
name = "plan-downloader"
version = "0.1.0"
description = "Download study-plan PDFs by driving Firefox."
requires-python = ">=3.15"
dependencies = ["auth", "playwright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plan_downloader"]

[tool.uv.sources]
auth = { workspace = true }

[tool.deptry.per_rule_ignores]
DEP003 = ["plan_downloader"]
