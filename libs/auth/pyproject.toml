[project]
name = "auth"
version = "0.1.0"
description = "Load UAFM credentials and generate TOTP login codes."
requires-python = ">=3.15"
dependencies = ["pyotp", "python-dotenv"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth"]

[tool.deptry.per_rule_ignores]
DEP003 = ["auth"]
