[project]
name = "plan-render"
version = "0.1.0"
description = "Shared graphite-frost rendering for the timetable apps."
requires-python = ">=3.15"
dependencies = ["pillow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plan_render"]

[tool.deptry.per_rule_ignores]
DEP003 = ["plan_render"]
