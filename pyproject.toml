[project]
name = "uafm-toolkit"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.uv.workspace]
members = ["libs/plan-parser", "apps/calendar-grid", "apps/plan-downloader"]

[tool.pytest.ini_options]
testpaths = ["libs", "apps"]

[tool.ruff.lint.isort]
known-first-party = ["calendar_grid", "plan_parser"]
