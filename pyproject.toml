[project]
name = "uafm-toolkit"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.uv.workspace]
members = ["apps/otp", "apps/overlap-view", "apps/week-view", "libs/auth", "libs/plan-downloader", "libs/plan-parser", "libs/plan-render"]

[tool.pytest.ini_options]
testpaths = ["libs", "apps"]

[tool.ruff.lint.isort]
known-first-party = ["auth", "otp", "overlap_view", "plan_downloader", "plan_parser", "plan_render", "week_view"]
